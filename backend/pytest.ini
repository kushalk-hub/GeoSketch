[pytest]
testpaths = tests
pythonpath = .
addopts = -ra --cov=app --cov-report=term-missing --cov-fail-under=85
filterwarnings =
    ignore::DeprecationWarning

[coverage:run]
branch = True
source = app

[coverage:report]
show_missing = True
skip_covered = True
exclude_lines =
    pragma: no cover
    if TYPE_CHECKING:
    raise NotImplementedError
